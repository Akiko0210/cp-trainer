# The Codeforces mirror, on a schedule instead of in a daemon.
#
# On a box, worker/app.py loops forever and syncs every member every 30
# minutes. A free serverless host has no process that stays up, so this runs
# the same pass on GitHub's machines and exits, on the same half-hour cadence.
# Measured: ~20s for 2 members — the per-member cost is two CF calls spaced
# ≥2.2s by the rate limiter in worker/cf_api.py, so roughly 5s each on top of
# ~15s of checkout and uv setup.
#
# Budget, because it is easy to overrun without noticing: a private repo on
# GitHub Free gets 2,000 Actions minutes a month, billed per run rounded up to
# the minute. Half-hourly at 1 billed minute ≈ 1,440/month — fits. The rounding
# is the whole game: a club of ~10 stays inside one minute a run, but a club of
# 30 is a ~3-minute run, ~4,300/month — at that size drop this back to hourly
# ("17 * * * *") or the schedule stops working part-way through the month.
#
# Three things GitHub does that will bite you if you don't know them:
#   * scheduled runs are best-effort and can be delayed under load
#   * in a repo with no pushes for 60 days, schedules are disabled entirely
#     (GitHub emails first) — a club tool that nobody commits to for a term
#     will quietly stop syncing until you re-enable it
#   * the cron is registered when THIS FILE is pushed to the default branch.
#     If Actions wasn't receiving events at that moment (this repo shipped
#     with delivery dead — see DEPLOY.md), the schedule silently never
#     exists: manual runs work, Settings says "up to date", nothing fires.
#     Fix: toggle Actions off/on in repo settings, then push an edit to
#     this file.

name: Sync Codeforces

on:
  schedule:
    - cron: "10,40 * * * *" # every half hour, off the hour: everyone crons at :00
  workflow_dispatch: # and a button, for "sync now, I just solved something"

concurrency:
  # Never let two passes overlap: both would hold their own rate-limit lock and
  # between them exceed what Codeforces allows from one address.
  group: cf-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung run must not eat the month's minutes

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Sync every linked member
        working-directory: worker
        env:
          # Settings → Secrets and variables → Actions → New repository secret.
          # Use the *pooled* connection string if your provider offers one.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python sync_once.py
