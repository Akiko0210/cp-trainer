# The Codeforces mirror, run by hand.
#
# **This used to carry a cron and no longer does — the schedule never worked.**
# Across ~30 hours this repository produced zero `schedule` runs while
# workflow_dispatch succeeded every time. Everything that can be checked was
# checked: valid cron on the default branch, workflow `active`, Actions
# `enabled`, no YAML traps, a freshly-indexed workflow record (forced by
# renaming the file), the repo-settings off/on toggle, and finally making the
# repository public. None of it produced a single scheduled run. It matches an
# open, unanswered GitHub community report. DEPLOY.md records the diagnosis.
#
# Syncing on this install is the worker's own loop (worker/app.py, every
# SYNC_INTERVAL_MINUTES). This file stays because dispatch is the one path that
# never failed: it is the button for "the worker is down and I need my solves
# counted now". Deleting it would leave no fallback at all.
#
# Measured: ~20s for 2 members — the per-member cost is two CF calls spaced
# ≥2.2s by the rate limiter in worker/cf_api.py, so roughly 5s each on top of
# ~15s of checkout and uv setup. Do not add a `schedule:` back while the worker
# owns the loop; two of them would hold separate rate limiters.

name: Sync Codeforces

on:
  workflow_dispatch: # the only trigger — see the note above

concurrency:
  # Never let two passes overlap: both would hold their own rate-limit lock and
  # between them exceed what Codeforces allows from one address.
  group: cf-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung run must not eat the month's minutes

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Sync every linked member
        working-directory: worker
        env:
          # Settings → Secrets and variables → Actions → New repository secret.
          # Use the *pooled* connection string if your provider offers one.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python sync_once.py
